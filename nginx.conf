server {
    listen 80;
    root /usr/share/nginx/html; # Root directory for static files
    index index.html; # Default file to serve

    location / {
        try_files $uri $uri/ /index.html; # Handle client-side routing
    }

    location /api {
        proxy_pass http://backend-service:8000; # Forward to backend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;  # WebSocket support
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host; # Preserve host header
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}