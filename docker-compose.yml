services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: support-desk-proj-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
    ports:
      - "8000:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
