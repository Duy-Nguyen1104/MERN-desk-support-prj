name: Build and Test Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build frontend image
        run: |
          docker build -t support-desk-proj-frontend:latest -f Dockerfile .

      - name: Build backend image
        run: |
          docker build -t support-desk-proj-backend:latest -f backend/Dockerfile .

      - name: Push frontend image to Docker Desktop
        run: |
          docker tag support-desk-proj-frontend:latest ${{ secrets.DOCKER_USERNAME }}/support-desk-proj-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/support-desk-proj-frontend:latest

      - name: Push backend image to Docker Desktop
        run: |
          docker tag support-desk-proj-backend:latest ${{ secrets.DOCKER_USERNAME }}/support-desk-proj-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/support-desk-proj-backend:latest
